<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch-zoom is left enabled on purpose (accessibility). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />

    <!-- 1. Ang iyong pixel chess icon mula sa public folder -->
    <link rel="icon" type="image/png" href="/chessgamelogo.png" />

    <!-- 2. SEO Meta Tags -->
    <title>NEO CHESS DX - Retro Cyberpunk Chess Game</title>
    <meta name="description" content="Play NEO CHESS DX, a highly responsive retro bento-grid chess web application featuring custom dark aesthetics and immersive game modules." />
    <link rel="canonical" href="https://neo-chess-xd.vercel.app/" />

    <!-- Open Graph tags para maganda tingnan kapag shinare mo ang link sa socials.
         Kailangang FULL URL ang image (hindi relative) para lumabas ang preview.
         Ang og-image.png ay ginagawa ng: node scripts/make-og-image.mjs -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://neo-chess-xd.vercel.app/" />
    <meta property="og:site_name" content="NEO CHESS DX" />
    <meta property="og:title" content="NEO CHESS DX - Retro Cyberpunk Chess Game" />
    <meta property="og:description" content="Play NEO CHESS DX, a highly responsive retro bento-grid chess web application." />
    <meta property="og:image" content="https://neo-chess-xd.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NEO CHESS DX: the red and blue pixel-art chess armies facing off" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NEO CHESS DX - Retro Cyberpunk Chess Game" />
    <meta name="twitter:description" content="Play NEO CHESS DX, a highly responsive retro bento-grid chess web application." />
    <meta name="twitter:image" content="https://neo-chess-xd.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
